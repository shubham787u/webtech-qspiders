<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box1 {
            height: 200px;
            width: 200px;
            background-color: yellow;
            position: absolute;
            animation-name: boxmove1;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
        }
        /* @keyframes boxmove1 {
            from {
                top: 0;
                left: 0;
            }
            to{
                top: calc(100% - 200px);
                left: calc(100% - 200px);
                border-radius: 50%;
            }
       }   */
        @keyframes boxmove1 {
            0%{
                top: 0;
                left: 0;
            }
            25%{
                top: 0;
                left: calc(100% - 200px);
            }
            50%{
                top: calc(100% - 200px);
                left: calc(100% - 200px);

            }
            75%{
                top: calc(100% - 200px);
                left: 0;
            }
            100%{
                left: 0;
                top: 0;
            }
             
        }
        
        .loader {
            height: 200px;
            width: 200px;
            border: 20px solid gainsboro;
            border-right: 20px solid gray;
            border-radius: 50%;
            animation-name: spinner;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        /* @keyframes spinner {
            from{
                rotate: 0deg;
            }
            to{
                rotate: 360deg;
            }     
        } */
    </style>
</head>
<body>
    <div class="box1"></div>

    <!-- <div class="loader"></div> -->
</body>
</html>
